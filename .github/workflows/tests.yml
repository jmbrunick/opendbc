name: tests

on:
  push:
    branches:
      - master
      - 'nap-*'
      - 'naponsp-*'
  pull_request:

jobs:
  nap_tests:
    name: NAP build and safety
    if: ${{ startsWith(github.ref_name, 'nap-') || startsWith(github.base_ref, 'nap-') || startsWith(github.ref_name, 'naponsp-') || startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/cache
    - name: Build NAP opendbc
      run: |
        source setup.sh
        scons -j$(nproc)
    - name: Lint NAP implementation and gates
      run: |
        source .venv/bin/activate
        ruff check \
          .github/ci/tesla_preap_longitudinal_mutations.py \
          .github/ci/tesla_preap_lat_yield_mutations.py \
          .github/ci/test_tests_workflow.py \
          opendbc/car/tesla/fingerprints.py \
          opendbc/car/tesla/pedal/controller.py \
          opendbc/car/tesla/preap \
          opendbc/car/tesla/test_pedal_regen.py \
          opendbc/safety/tests/test_mg.py \
          opendbc/safety/tests/test_tesla_preap.py \
          opendbc/safety/tests/test_tesla_preap_blinker.py \
          opendbc/safety/tests/test_tesla_preap_lat_yield.py \
          opendbc/safety/tests/test_tesla_preap_radar_carconfig.py
    - name: Run NAP car and safety suites
      run: |
        source .venv/bin/activate
        pytest -q -n 0 \
          opendbc/car/tesla/preap/tests/ \
          opendbc/car/tesla/test_pedal_regen.py \
          opendbc/safety/tests/test_mg.py \
          opendbc/safety/tests/test_tesla_preap.py \
          opendbc/safety/tests/test_tesla_preap_blinker.py \
          opendbc/safety/tests/test_tesla_preap_lat_yield.py \
          opendbc/safety/tests/test_tesla_preap_radar_carconfig.py
    - name: Run lateral-yield mutation checks
      run: |
        source .venv/bin/activate
        python .github/ci/tesla_preap_lat_yield_mutations.py

  tests:
    name: ./test.sh (${{ matrix.name }})
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-24.04' }}
            name: Linux
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-macos-8x14' || 'macos-latest' }}
            name: macOS
    steps:
    - uses: actions/checkout@v7
    - uses: commaai/timeout@v1
      with:
        timeout: ${{ github.repository == 'commaai/opendbc' && '90' || '999' }}
    - run: ./test.sh

  tesla_preap_longitudinal_regression:
    name: Tesla Pre-AP longitudinal regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Check workflow contract
      run: python3 .github/ci/test_tests_workflow.py
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install test dependencies
      run: uv sync --extra testing
    - name: Run focused longitudinal tests
      run: |
        source .venv/bin/activate
        pytest -q -n 0 \
          opendbc/car/tesla/preap/tests/test_pedal_authority.py \
          opendbc/car/tesla/preap/tests/test_virtual_das.py \
          opendbc/car/tesla/preap/tests/test_vdas_grade_control.py \
          opendbc/car/tesla/preap/tests/test_accel_limits.py \
          opendbc/car/tesla/preap/tests/test_engage_grace.py \
          opendbc/car/tesla/preap/tests/test_longitudinal_tuning.py
    - name: Run historical mutation checks
      run: |
        source .venv/bin/activate
        python .github/ci/tesla_preap_longitudinal_mutations.py

  safety_tests:
    name: safety
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    steps:
    - uses: commaai/timeout@v1
      with:
        timeout: ${{ github.repository == 'commaai/opendbc' && '60' || '999' }}
    - uses: actions/checkout@v7
    - name: Run safety tests
      run: ./opendbc/safety/tests/test.sh

  mutation:
    name: Safety mutation tests (${{ matrix.name }})
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
            name: Linux
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-macos-8x14' || 'macos-latest' }}
            name: macOS
    steps:
      - uses: actions/checkout@v7
      - name: Run mutation tests
        run: |
          source setup.sh
          python opendbc/safety/tests/mutation.py

  car_diff:
    name: car diff
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    env:
      GIT_REF: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Test car diff
      if: github.event_name == 'pull_request'
      run: source setup.sh && python opendbc/car/tests/car_diff.py | tee diff.txt
    - name: Upload diff
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: car_diff_${{ github.event.number }}
        path: diff.txt
    - name: Update refs
      if: github.repository == 'commaai/opendbc' && github.ref == 'refs/heads/master'
      run: source setup.sh && python opendbc/car/tests/car_diff.py --update-refs
    - name: Checkout ci-artifacts
      if: github.repository == 'commaai/opendbc' && github.ref == 'refs/heads/master'
      uses: actions/checkout@v7
      with:
        repository: commaai/ci-artifacts
        ssh-key: ${{ secrets.CI_ARTIFACTS_DEPLOY_KEY }}
        path: ${{ github.workspace }}/ci-artifacts
    - name: Push refs
      if: github.repository == 'commaai/opendbc' && github.ref == 'refs/heads/master'
      working-directory: ${{ github.workspace }}/ci-artifacts
      run: |
        ls ${{ github.workspace }}/car_diff/*.zst 2>/dev/null || exit 0
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git fetch origin car_diff || true
        git checkout car_diff 2>/dev/null || git checkout --orphan car_diff
        cp ${{ github.workspace }}/car_diff/*.zst .
        git add *.zst
        git commit -m "car_diff refs for ${{ github.sha }}" || echo "No changes to commit"
        git push origin car_diff

  test_models:
    name: test models
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3]
    env:
      CI: 1
    steps:
    - uses: actions/checkout@v7
    - run: ./setup.sh
    - name: Cache test routes
      id: routes-cache
      uses: actions/cache@v6
      with:
        path: /tmp/comma_download_cache
        key: car_models-${{ hashFiles('opendbc/car/tests/test_models.py', 'opendbc/car/tests/routes.py') }}-${{ matrix.job }}
    - name: Test car models
      timeout-minutes: ${{ contains(runner.name, 'nsc') && (steps.routes-cache.outputs.cache-hit == 'true') && 2 || 8 }}
      run: source .venv/bin/activate && MAX_EXAMPLES=1 opendbc/car/tests/test_models.py
      env:
        NUM_JOBS: 4
        JOB_ID: ${{ matrix.job }}
