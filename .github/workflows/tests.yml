name: tests

on:
  push:
    branches:
      - master
      - 'nap-*'
      - 'naponsp-*'
  pull_request:

jobs:
  nap_tests:
    name: NAP build and safety
    if: ${{ startsWith(github.ref_name, 'nap-') || startsWith(github.base_ref, 'nap-') || startsWith(github.ref_name, 'naponsp-') || startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/cache
    - name: Build NAP opendbc
      run: |
        source setup.sh
        scons -j$(nproc)
    - name: Lint NAP implementation and gates
      run: |
        source .venv/bin/activate
        ruff check \
          .github/ci/tesla_preap_longitudinal_mutations.py \
          .github/ci/tesla_preap_lat_yield_mutations.py \
          .github/ci/test_tests_workflow.py \
          opendbc/car/tesla/fingerprints.py \
          opendbc/car/tesla/pedal/controller.py \
          opendbc/car/tesla/preap \
          opendbc/car/tesla/test_pedal_regen.py \
          opendbc/safety/tests/test_mg.py \
          opendbc/safety/tests/test_tesla_preap.py \
          opendbc/safety/tests/test_tesla_preap_blinker.py \
          opendbc/safety/tests/test_tesla_preap_lat_yield.py \
          opendbc/safety/tests/test_tesla_preap_radar_carconfig.py
    - name: Run NAP car and safety suites
      run: |
        source .venv/bin/activate
        pytest -q -n 0 \
          opendbc/car/tesla/preap/tests/ \
          opendbc/car/tesla/test_pedal_regen.py \
          opendbc/safety/tests/test_mg.py \
          opendbc/safety/tests/test_tesla_preap.py \
          opendbc/safety/tests/test_tesla_preap_blinker.py \
          opendbc/safety/tests/test_tesla_preap_lat_yield.py \
          opendbc/safety/tests/test_tesla_preap_radar_carconfig.py
    - name: Run lateral-yield mutation checks
      run: |
        source .venv/bin/activate
        python .github/ci/tesla_preap_lat_yield_mutations.py

  tests:
    name: ./test.sh
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-24.04' }}
          - os: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-macos-8x14' || 'macos-latest' }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/cache
      id: cache
    - uses: commaai/timeout@v1
      with:
        timeout: ${{ github.repository == 'commaai/opendbc' && (steps.cache.outputs.cache-hit == 'true' && '60' || '90') || '999' }}
    - run: ./test.sh

  tesla_preap_longitudinal_regression:
    name: Tesla Pre-AP longitudinal regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Check workflow contract
      run: python3 .github/ci/test_tests_workflow.py
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install test dependencies
      run: uv sync --extra testing
    - name: Run focused longitudinal tests
      run: |
        source .venv/bin/activate
        pytest -q -n 0 \
          opendbc/car/tesla/preap/tests/test_pedal_authority.py \
          opendbc/car/tesla/preap/tests/test_virtual_das.py \
          opendbc/car/tesla/preap/tests/test_vdas_grade_control.py \
          opendbc/car/tesla/preap/tests/test_accel_limits.py \
          opendbc/car/tesla/preap/tests/test_engage_grace.py \
          opendbc/car/tesla/preap/tests/test_longitudinal_tuning.py
    - name: Run historical mutation checks
      run: |
        source .venv/bin/activate
        python .github/ci/tesla_preap_longitudinal_mutations.py

  safety_tests:
    name: safety
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        flags: ['--ubsan']
    steps:
    - uses: commaai/timeout@v1
      with:
        timeout: ${{ github.repository == 'commaai/opendbc' && '60' || '999' }}
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/cache
    - name: Run safety tests
      run: ./opendbc/safety/tests/test.sh ${{ matrix.flags }}

  mutation:
    name: Safety mutation tests
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      GIT_REF: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need master to get diff
      - uses: ./.github/workflows/cache
      - name: Run mutation tests
        run: |
          source setup.sh
          scons -j8
          cd opendbc/safety/tests && ./mutation.sh

  # TODO: this needs to move to opendbc
  test_models:
    name: test models
    if: ${{ !startsWith(github.ref_name, 'nap-') && !startsWith(github.base_ref, 'nap-') && !startsWith(github.ref_name, 'naponsp-') && !startsWith(github.base_ref, 'naponsp-') }}
    runs-on: ${{ github.repository == 'commaai/opendbc' && 'namespace-profile-amd64-8x16' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3]
    env:
      CI: 1
    steps:
    - uses: actions/checkout@v4
      with:
        repository: 'commaai/openpilot'
        ref: 'master'
        submodules: true
    - run: ./tools/op.sh setup
    - run: rm -rf opendbc_repo/
    - uses: actions/checkout@v4
      with:
        path: opendbc_repo
    - name: Cache test routes
      id: routes-cache
      uses: actions/cache@v4
      with:
        path: /tmp/comma_download_cache
        key: car_models-${{ hashFiles('openpilot/selfdrive/car/tests/test_models.py', 'opendbc/car/tests/routes.py') }}-${{ matrix.job }}
    - name: Build openpilot
      run: scons -j$(nproc) openpilot/common/ openpilot/cereal/ openpilot/selfdrive/pandad/ msgq_repo/ opendbc_repo
    - name: Test car models
      timeout-minutes: ${{ contains(runner.name, 'nsc') && (steps.routes-cache.outputs.cache-hit == 'true') && 2 || 6 }}
      run: MAX_EXAMPLES=1 pytest --continue-on-collection-errors --durations=0 --durations-min=5 -n logical openpilot/selfdrive/car/tests/test_models.py
      env:
        NUM_JOBS: 4
        JOB_ID: ${{ matrix.job }}
